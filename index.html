<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Surprise</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      /* 背景設定 */
      background-image: url('treasure_bg.png'); 
      background-size: cover; 
      background-position: center top; 
      background-repeat: no-repeat;
      background-color: #2c1a1a; /* 画像が読み込まれるまでの予備色 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* =========================================
       ▼ 追加エリア：オープニング（プレゼント）画面
       ========================================= */
    #opening-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      background-color: #2c1a1a; /* 背景色（画像が読み込まれるまで、または雰囲気作り） */
      background-image: radial-gradient(circle, #4a2b2b 0%, #1a0f0f 100%); /* 少しリッチなグラデ */
      z-index: 9999; /* 最前面に配置 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* スライドを防ぐために transition は opacity だけにする */
      transition: opacity 0.8s ease-out;
    }

    /* プレゼントボックスの画像 */
    .present-box {
      width: 200px;
      height: auto;
      cursor: pointer;
      /* アニメーションの起点を真ん中に固定 */
      transform-origin: center center;
      animation: shake 2.5s infinite ease-in-out;
      /* transformにtransitionをかけるとズレる原因になるので削除または整理 */
      /* transition: transform 0.2s; */
    }

    /* 修正版プルプル：回転（rotate）だけに絞る */
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      10%, 30%, 50%, 70%, 90% { transform: rotate(-3deg); }
      20%, 40%, 60%, 80% { transform: rotate(3deg); }
    }

    /* 修正版拡大：中心から広がるように scale だけにする */
    @keyframes openBox {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }

    /* 「Tap Me!」の文字 */
    .tap-text {
      color: #ffd700;
      font-family: 'Playfair Display', serif;
      margin-top: 20px;
      font-size: 1.5rem;
      animation: blink 1.5s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.6; }
      to { opacity: 1; text-shadow: 0 0 10px #ffd700; }
    }

    /* フラッシュ演出用レイヤー（真っ白な光） */
    #flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 10000; /* プレゼント画面よりさらに上 */
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease-out;
    }

    /* =========================================
       ▲ 追加エリア終了
       ========================================= */


    /* --- 以下、既存のメイン画面用CSS --- */

    @keyframes floating {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }

    .hamster-img {
      width: 120%; 
      max-width: 450px;
      height: auto;
      margin-bottom: 3vh;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.9)) 
              drop-shadow(0 0 60px rgba(255, 100, 0, 0.4));
      z-index: 2;
      animation: floating 4s ease-in-out infinite;
      transition: filter 0.3s;
      
      /* 最初は隠しておく（フェードインのため） */
      opacity: 0;
      transform: scale(0.8);
    }
    
    /* ハムスター出現時のアニメーションクラス */
    .hamster-appear {
      animation: appearHamster 1s forwards ease-out, floating 4s ease-in-out infinite 1s;
    }

    @keyframes appearHamster {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ハム後ろの派手な後光 */
    .halo {
      position: absolute;
      top: 35%; 
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      background: repeating-conic-gradient(
        rgba(255, 255, 255, 0.4) 0deg 10deg,  /* 白い光の帯 */
        rgba(255, 215, 0, 0.1) 10deg 20deg,   /* 少し金色の隙間 */
        transparent 20deg 30deg               /* 透明な隙間（これを入れるとより旭日旗っぽくなります） */
      );
        
      /* 周りをボカして、中心から外へ消えていくように見せる */
      -webkit-mask-image: radial-gradient(circle, black 20%, transparent 75%);
      mask-image: radial-gradient(circle, black 20%, transparent 75%);
      border-radius: 50%;
      z-index: 1;
      mix-blend-mode: screen; /* 背景となじませる */
      animation: rotate-halo 25s linear infinite; /* 少しゆっくり回転 */
      opacity: 0; /* 最初は隠す */
      transition: opacity 2s;
    }

    /* 回転のアニメーション */
    @keyframes rotate-halo {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .message-container {
      width: 90%;
      max-width: 380px; /* iPhone 15 Plusの幅430pxより少し小さく設定 */
      background: rgba(0, 0, 0, 0.65); /* 少し濃くして読みやすく */
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px); /* 高級感のあるボカシ */
      border: 1.5px solid rgba(255, 215, 0, 0.4); /* 金色の枠 */
      text-align: center;
      color: white;
      z-index: 3; /* ハムスターより手前に */
      opacity: 0; /* 最初は隠す */
      transform: translateY(20px);
      transition: all 1s ease-out 0.5s; /* 少し遅れて出現 */
    }

    /* メッセージ出現用クラス */
    .message-show {
      opacity: 1;
      transform: translateY(0);
    }

    h1 {
      /* ↓ serifを追加して予備フォントを指定 */
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #ffd700;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    p { margin: 8px 0; font-size: 1rem; line-height: 1.6; }
    .date { font-size: 0.8rem; color: #ccc; margin-top: 15px; }

    /* キラキラ・星のスタイル（既存維持） */
    .sparkle {
      position: fixed; width: 6px; height: 6px; top: -20%;
      background: white; border-radius: 50%;
      box-shadow: 0 0 10px #fff, 0 0 20px #ffd700, 0 0 30px #ff4500;
      opacity: 0; z-index: 10; pointer-events: none;
    }
    /* 十字に光る星のスタイル */
    .sparkle-star {
      position: fixed; top: -20%; background: white;
      clip-path: polygon(50% 0%, 55% 45%, 100% 50%, 55% 55%, 50% 100%, 45% 55%, 0% 50%, 45% 45%);
      box-shadow: 0 0 15px #fff, 0 0 30px #ffd700;
      z-index: 10; pointer-events: none;
    }
    /* ボケた光の玉のスタイル */
    .sparkle-orb {
      position: fixed;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 10%, rgba(255,215,0,0.6) 40%, rgba(255,200,0,0) 70%);
      filter: blur(12px); border-radius: 50%; pointer-events: none; opacity: 0;
    }
    /* その場できらきら（明滅）させるアニメーション */
    @keyframes twinkle-orb {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0; }
    }
    /* 落下アニメーション（既に書いてある fall を再利用、または微調整） */
    @keyframes fall-varied {
      0% { transform: translateY(0vh) scale(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(110vh) scale(1) rotate(360deg); opacity: 0; }
    }
  </style>
</head>

<body>
  <div id="flash-overlay"></div> <div id="opening-screen">
    <img src="present.png" alt="Present Box" class="present-box" onclick="openPresent()">
    <div class="tap-text">Tap Me!</div>
  </div>
  <div class="halo" id="main-halo"></div>

  <img src="hamster.png" class="hamster-img" id="main-hamster" alt="Pirate Hamster">

  <div class="message-container" id="main-message">
    <h1>Happy Valentine's Day !</h1>
    <p>
      いつも美味しいご飯をありがとう！<br>
      無理は、しちゃダメだぞ〜<br>
    </p>
    <p class="date">2026.02.14 Special Build for You</p>
  </div>

  <script>
    // ▼▼▼ プレゼント開封ロジック ▼▼▼
    function openPresent() {
      const box = document.querySelector('.present-box');
      const openingScreen = document.getElementById('opening-screen');
      const flash = document.getElementById('flash-overlay');
      
      // 1. 箱のアニメーション（拡大）
      box.classList.add('open-anim');
      document.querySelector('.tap-text').style.opacity = 0; // 文字はすぐ消す

      // 2. 光のフラッシュ（0.4秒後に真っ白に）
      setTimeout(() => {
        flash.style.opacity = 1;
      }, 400);

      // 3. 画面切り替え（0.8秒後）
      setTimeout(() => {
        // オープニングを消す
        openingScreen.style.display = 'none';
        
        // メインコンテンツを表示状態にする（アニメーション開始）
        showMainContent();
        
        // フラッシュをフェードアウト
        flash.style.opacity = 0;
        
        // フラッシュのレイヤーを削除（操作の邪魔にならないように）
        setTimeout(() => { flash.style.display = 'none'; }, 1000);
      }, 800);
    }

    function showMainContent() {
      // ハムスター登場
      document.getElementById('main-hamster').classList.add('hamster-appear');
      // メッセージ登場
      document.getElementById('main-message').classList.add('message-show');
      // 後光登場
      document.getElementById('main-halo').style.opacity = 1;
      
      // キラキラ生成開始
      initSparkles();
    }
    // ▲▲▲ ロジック終わり ▲▲▲


    // ▼▼▼ 既存のキラキラ生成コード（関数化） ▼▼▼
    function createSparkle() {
      const container = document.body;
      const sparkle = document.createElement('div');
      
      const isStar = Math.random() > 0.5;
      sparkle.className = isStar ? 'sparkle-star' : 'sparkle-orb';
      
      if (isStar) {
        const size = (Math.random() * 15 + 10) + 'px';
        sparkle.style.width = size;
        sparkle.style.height = size;
        sparkle.style.left = Math.random() * 100 + 'vw';
        const duration = Math.random() * 5 + 5 + 's';
        sparkle.style.animation = `fall-varied ${duration} linear infinite`;
        sparkle.style.zIndex = "10";
      } else {
        let left, top;
        let isOverFace = true;
        let attempts = 0;
        while (isOverFace && attempts < 10) {
          left = Math.random() * 90;
          top = Math.random() * 90;
          const isInFaceHorizontal = (left > 30 && left < 70);
          const isInFaceVertical = (top > 15 && top < 50);
          if (!(isInFaceHorizontal && isInFaceVertical)) {
            isOverFace = false;
          }
          attempts++;
        }
        sparkle.style.left = left + 'vw';
        sparkle.style.top = top + 'vh';
        const size = (Math.random() * 80 + 60) + 'px';
        sparkle.style.width = size;
        sparkle.style.height = size;
        const duration = Math.random() * 4 + 3 + 's';
        sparkle.style.animation = `twinkle-orb ${duration} ease-in-out infinite`;
        sparkle.style.zIndex = "4"; 
      }
      sparkle.style.animationDelay = Math.random() * 5 + 's';
      container.appendChild(sparkle);
    }

    function initSparkles() {
      for (let i = 0; i < 25; i++) {
        createSparkle();
      }
    }
  </script>
</body>
</html>
