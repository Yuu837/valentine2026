<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Surprise</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }

    /* ふわふわ動くアニメーションの定義 */
    @keyframes floating {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); } /* 巨大なので少し大きめに動かします */
      100% { transform: translateY(0); }
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;/* 念のための予備 */
        height: 100dvh; /* iPhoneのバーを考慮した「本当の」画面の高さ */
        overflow-y: auto; /* 万が一はみ出した時だけ縦にスクロールさせる */
        overflow-x: hidden; /* 横揺れは絶対に禁止 */
      
      /* 背景設定：比率維持・上端基準 */
      background-image: url('treasure_bg.png'); 
      background-size: cover; 
      background-position: center top; 
      background-repeat: no-repeat;
      background-color: #2c1a1a; /* 画像が読み込まれるまでの予備色 */

      display: flex;
      flex-direction: column;
      align-items: center;
      /* ↓ 上端ではなく、中央に寄せる設定に変更 */
      justify-content: center; 
      padding: 20px; /* 上下の余裕 */
    }

    .hamster-img {
      /* ↓ 今の約1.8倍（50%→90%）に拡大。これが画面幅いっぱいの限界サイズです */
      width: 90%; 
      max-width: 450px; /* iPhone 15 Plusの幅に合わせた最大サイズ */
      height: auto;
      margin-bottom: 3vh;
      filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.7));
      z-index: 2;
      /* ↓ ふわふわアニメーションを適用 */
      animation: floating 4s ease-in-out infinite;
    }

    .message-container {
      width: 90%;
      max-width: 380px; /* iPhone 15 Plusの幅430pxより少し小さく設定 */
      background: rgba(0, 0, 0, 0.65); /* 少し濃くして読みやすく */
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px); /* 高級感のあるボカシ */
      border: 1.5px solid rgba(255, 215, 0, 0.4); /* 金色の枠 */
      text-align: center;
      color: white;
      z-index: 3; /* ハムスターより手前に */
    }

    h1 {
      /* ↓ serifを追加して予備フォントを指定 */
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #ffd700;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    p {
      margin: 8px 0;
      font-size: 1rem;
      line-height: 1.6;
    }

    .date {
      font-size: 0.8rem;
      color: #ccc;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <img src="hamster.png" class="hamster-img" alt="Pirate Hamster">

  <div class="message-container">
    <h1>Happy Valentine's Day!</h1>
    <p>いつも美味しいご飯をありがとう！</p>
    <p class="date">2026.02.14 Special Build for You</p>
  </div>

</body>
</html>
