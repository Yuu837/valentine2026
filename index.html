<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Surprise</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }

    /* ふわふわ動くアニメーションの定義 */
    @keyframes floating {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); } /* 巨大なので少し大きめに動かします */
      100% { transform: translateY(0); }
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;/* 念のための予備 */
        height: 100dvh; /* iPhoneのバーを考慮した「本当の」画面の高さ */
        overflow: hidden; /* スクロールバー生成防止 はみ出したオブジェクトは無視 */
      
      /* 背景設定：比率維持・上端基準 */
      background-image: url('treasure_bg.png'); 
      background-size: cover; 
      background-position: center top; 
      background-repeat: no-repeat;
      background-color: #2c1a1a; /* 画像が読み込まれるまでの予備色 */

      display: flex;
      flex-direction: column;
      align-items: center;
      /* ↓ 上端ではなく、中央に寄せる設定に変更 */
      justify-content: center; 
      padding: 20px; /* 上下の余裕 */
    }

    .hamster-img {
      /* ↓ 今の約1.8倍（50%→90%）に拡大。これが画面幅いっぱいの限界サイズです */
      width: 120%; 
      max-width: 450px; /* iPhone 15 Plusの幅に合わせた最大サイズ */
      height: auto;
      margin-bottom: 3vh;
      /* ↓ 既存の影をより強力な「後光」にアップグレード */
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.9)) 
              drop-shadow(0 0 60px rgba(255, 100, 0, 0.4));
      z-index: 2;
      animation: floating 4s ease-in-out infinite;
      
      /* ↓ これが後光のポイント：光が脈打つようにします */
      transition: filter 0.3s;
    }

    /* ハム後ろの派手な後光 */
    .halo {
      position: absolute;
      top: 35%; /* ハムスターの位置に合わせて微調整 */
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
  
      /* ↓ 修正ポイント：ここを1つにまとめます */      background: repeating-conic-gradient(
        rgba(255, 255, 255, 0.4) 0deg 10deg,  /* 白い光の帯 */
        rgba(255, 215, 0, 0.1) 10deg 20deg,   /* 少し金色の隙間 */
        transparent 20deg 30deg                 /* 透明な隙間（これを入れるとより旭日旗っぽくなります） */
      );
        
      /* 周りをボカして、中心から外へ消えていくように見せる */
      -webkit-mask-image: radial-gradient(circle, black 20%, transparent 75%);
      mask-image: radial-gradient(circle, black 20%, transparent 75%);

      border-radius: 50%;
      z-index: 1;
      mix-blend-mode: screen; /* 背景となじませる */
      animation: rotate-halo 25s linear infinite; /* 少しゆっくり回転 */
    }

    /* 回転のアニメーション */
    @keyframes rotate-halo {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(2.5); opacity: 0.2; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    }

    .message-container {
      width: 90%;
      max-width: 380px; /* iPhone 15 Plusの幅430pxより少し小さく設定 */
      background: rgba(0, 0, 0, 0.65); /* 少し濃くして読みやすく */
      padding: 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px); /* 高級感のあるボカシ */
      border: 1.5px solid rgba(255, 215, 0, 0.4); /* 金色の枠 */
      text-align: center;
      color: white;
      z-index: 3; /* ハムスターより手前に */
    }

    h1 {
      /* ↓ serifを追加して予備フォントを指定 */
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #ffd700;
      margin: 0 0 10px 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    p {
      margin: 8px 0;
      font-size: 1rem;
      line-height: 1.6;
    }

    .date {
      font-size: 0.8rem;
      color: #ccc;
      margin-top: 15px;
    }

    /* キラキラの共通設定 */
    .sparkle {
      position: fixed;
      width: 6px;
      height: 6px;
      top: -20%; /* ハムスターの位置に合わせて微調整 */
      /* left: 50%; */
      /* background: #ffd700; /* 金色の光 */
      /* border-radius: 50%; */
      /* box-shadow: 0 0 10px #fff, 0 0 20px #ffd700; */
      background: white; /* 中心は白、外は金 */
      border-radius: 50%;
      box-shadow: 0 0 10px #fff, 0 0 20px #ffd700, 0 0 30px #ff4500;
      opacity: 0;
      z-index: 10; /* 背景とハムスターの間 */
      pointer-events: none; /* タッチの邪魔をしない */
    }

    /* キラキラが降るアニメーション */
    @keyframes fall {
      0% { transform: translateY(0vh) scale(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(110vh) scale(0.5) rotate(360deg); opacity: 0; }
    }

    /* それぞれのキラキラに違う動きをさせる */
  .s1 { left: 10%; width: 8px; height: 8px; animation: fall 12s infinite ease-in; }
  .s2 { left: 30%; width: 4px; height: 4px; animation: fall 16s infinite linear 1s; }
  .s3 { left: 20%; width: 12px; height: 12px; animation: fall 10s infinite ease-in 2s; }
  .s4 { left: 70%; width: 6px; height: 6px; animation: fall 20s infinite linear 0.5s; }
  .s5 { left: 90%; width: 8px; height: 8px; animation: fall 14s infinite ease-in 3s; }
  .s6 { left: 20%; width: 7px; height: 7px; animation: fall 18s infinite linear 4s; }
  .s7 { left: 80%; width: 10px; height: 10px; animation: fall 8s infinite ease-in 1.5s; }

  /* 十字に光る星のスタイル */
  .sparkle-star {
    position: fixed;
    top: -20%;
    background: white;
    /* 十字の光を擬似要素で作る */
    clip-path: polygon(50% 0%, 55% 45%, 100% 50%, 55% 55%, 50% 100%, 45% 55%, 0% 50%, 45% 45%);
    box-shadow: 0 0 15px #fff, 0 0 30px #ffd700;
    z-index: 10;
    pointer-events: none;
  }

  /* ボケた光の玉のスタイル */
  .sparkle-orb {
    position: fixed;
    /* top: -100px; */
    background: radial-gradient(circle, rgba(255,255,255,0.9) 10%, rgba(255,215,0,0.6) 40%, rgba(255,200,0,0) 70%);
    filter: blur(12px); /* これでボケ感を出す */
    border-radius: 50%;
    pointer-events: none;
    opacity: 0; /* 最初は透明 */
  }

  /* その場できらきら（明滅）させるアニメーション */
  @keyframes twinkle-orb {
    0% { transform: scale(0.8); opacity: 0; }
    50% { transform: scale(1.2); opacity: 1; } /* はっきり光らせる */
    100% { transform: scale(0.8); opacity: 0; }
  }

  /* 落下アニメーション（既に書いてある fall を再利用、または微調整） */
  @keyframes fall-varied {
    0% { transform: translateY(0vh) scale(0) rotate(0deg); opacity: 0; }
    20% { opacity: 0.8; }
    100% { transform: translateY(110vh) scale(1) rotate(360deg); opacity: 0; }
  }
  </style>
</head>

<body>
  <div class="halo"></div>

  <div class="sparkle s1"></div>
  <div class="sparkle s2"></div>
  <div class="sparkle s3"></div>
  <div class="sparkle s4"></div>
  <div class="sparkle s5"></div>
  <div class="sparkle s6"></div>
  <div class="sparkle s7"></div>

  <img src="hamster.png" class="hamster-img" alt="Pirate Hamster">

  <div class="message-container">
    <h1>Happy Valentine's Day !</h1>
    <p>
      いつも美味しいご飯をありがとう！<br>
      無理は、しちゃダメだぞ〜<br>
    </p>
    <p class="date">2026.02.14 Special Build for You</p>
  </div>

  <script>
    // JavaScriptでキラキラをランダムに生成
  function createSparkle() {
    const container = document.body;
    const sparkle = document.createElement('div');
    
    // 50%の確率で「星」か「玉」にする
    const isStar = Math.random() > 0.5;
    sparkle.className = isStar ? 'sparkle-star' : 'sparkle-orb';
    
    if (isStar) {
      // 【星】は今まで通り降らせる
      const size = (Math.random() * 15 + 10) + 'px';
      sparkle.style.width = size;
      sparkle.style.height = size;
      sparkle.style.left = Math.random() * 100 + 'vw';
      const duration = Math.random() * 5 + 5 + 's';
      sparkle.style.animation = `fall-varied ${duration} linear infinite`;
      sparkle.style.zIndex = "10";
    } else {
      // --- 光の玉の配置ロジック ---
      let left, top;
      let isOverFace = true;

      // 「顔に重ならない座標」が決まるまでループ（最大10回挑戦）
      let attempts = 0;
      while (isOverFace && attempts < 10) {
        left = Math.random() * 90; // 0〜90vw
        top = Math.random() * 90;  // 0〜90vh

        // 顔周辺（横30%-70%、縦15%-50%）に入っていないかチェック
        const isInFaceHorizontal = (left > 30 && left < 70);
        const isInFaceVertical = (top > 15 && top < 50);

        if (!(isInFaceHorizontal && isInFaceVertical)) {
          isOverFace = false; // 安全な場所なのでループを抜ける
        }
        attempts++;
      }

      sparkle.style.left = left + 'vw';
      sparkle.style.top = top + 'vh';
      // 【光の玉】はその場に留まってきらきらさせる
      const size = (Math.random() * 80 + 60) + 'px'; // さらに大きく
      sparkle.style.width = size;
      sparkle.style.height = size;

      
      // 明滅のスピードをランダムに（4秒〜8秒かけて1回光る）
      const duration = Math.random() * 4 + 3 + 's';
      sparkle.style.animation = `twinkle-orb ${duration} ease-in-out infinite`;
      
      // ★ここが重要！ z-indexを「4」に変更して、一番手前に持ってきます
      sparkle.style.zIndex = "4"; 
    }    // ランダムな遅延
    sparkle.style.animationDelay = Math.random() * 5 + 's';
    container.appendChild(sparkle);
  }

  // 25個くらい生成してみる
  for (let i = 0; i < 25; i++) {
    createSparkle();
  }
  </script>
</body></html>
